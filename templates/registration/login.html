{% extends 'base.html' %}
{% block title %}Login — BarakahOS{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">◆ BarakahOS</div>
        <div class="auth-tagline">Build Discipline. Earn Barakah.</div>

        <div class="auth-title">Welcome back</div>

        {% if form.errors %}
            <div class="alert alert-error">Invalid username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input type="text" name="username" id="id_username"
                       class="form-input" required autofocus>
            </div>
            <div class="form-group" style="margin-bottom:24px">
                <label class="form-label" for="id_password">Password</label>
                <input type="password" name="password" id="id_password"
                       class="form-input" required>
            </div>
            <button type="submit" class="btn btn-gold btn-full btn-lg">Sign In</button>
        </form>

        <div class="auth-footer">
            No account? <a href="{% url 'core:register' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
