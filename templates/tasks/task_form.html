{% extends 'base.html' %}
{% block title %}New Task — BarakahOS{% endblock %}

{% block content %}
<div style="max-width:480px">
    <div class="page-actions" style="margin-bottom:24px">
        <h1 class="page-title" style="margin-bottom:0">New Task</h1>
        <a href="{% url 'core:task_list' %}" class="btn btn-ghost btn-sm">Cancel</a>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    {% for error in field.errors %}
                        <div class="form-error">{{ error }}</div>
                    {% endfor %}
                {% endif %}
            </div>
            {% endfor %}
            <div style="margin-top:8px;display:flex;gap:10px">
                <button type="submit" class="btn btn-gold">Save Task</button>
                <a href="{% url 'core:task_list' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
